<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>0.3MP Dither Cam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #0f0;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  #viewfinder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated; /* Отключаем сглаживание для честных пикселей */
  }
  #controls {
    padding: 15px;
    background: #1a1a1a;
    border-top: 2px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  button {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 12px 16px;
    font-family: monospace;
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
  }
  button:active { background: #fff; color: #000; }
  #snap { background: #fff; color: #000; }
  #snap:active { background: #888; }
</style>
</head>
<body>

<div id="viewfinder">
  <canvas id="canvas"></canvas>
</div>

<div id="controls">
  <button id="modeBtn">РЕЖИМ: ДИЗЕР</button>
  <button id="snap">СНЯТЬ</button>
</div>

<video id="video" autoplay playsinline style="display:none;"></video>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const modeBtn = document.getElementById('modeBtn');
const snapBtn = document.getElementById('snap');

// Крошечное разрешение (примерно 0.07 Мп для жесткого пикселя, можно поменять на 480x640)
const W = 240;
const H = 320;
canvas.width = W;
canvas.height = H;

let mode = 0; // 0 = 1-bit Dither, 1 = Грязное Ч/Б (4 уровня серого)
const modes = ['ДИЗЕР 1-BIT', 'КСЕРОКС 2-BIT'];

// Матрица Байера 4x4 для упорядоченного дизеринга
const bayer4x4 = [
  [ 15, 135,  45, 165],
,
  [ 60, 180,  30, 150],
  [240, 120, 210,  90]
];

// Запуск тыловой камеры
navigator.mediaDevices.getUserMedia({
  video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
  audio: false
}).then(stream => {
  video.srcObject = stream;
  requestAnimationFrame(processFrame);
}).catch(err => {
  alert('Ошибка камеры: ' + err.message);
});

modeBtn.addEventListener('click', () => {
  mode = (mode + 1) % modes.length;
  modeBtn.textContent = modes[mode];
});

function processFrame() {
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    // Рисуем видео в крошечный канвас (кроп по центру)
    const vRatio = video.videoWidth / video.videoHeight;
    const cRatio = W / H;
    let sx, sy, sw, sh;
    if (vRatio > cRatio) {
      sh = video.videoHeight;
      sw = sh * cRatio;
      sx = (video.videoWidth - sw) / 2;
      sy = 0;
    } else {
      sw = video.videoWidth;
      sh = sw / cRatio;
      sx = 0;
      sy = (video.videoHeight - sh) / 2;
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);

    // Забираем массив пикселей
    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        // Перевод в яркость (Ч/Б) с легким задиранием контраста
        let lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        lum = (lum - 128) * 1.2 + 128; // Контраст

        let val = 0;
        if (mode === 0) {
          // Упорядоченный дизеринг (черные и белые точки)
          const threshold = bayer4x4[y % 4][x % 4];
          val = lum > threshold ? 255 : 0;
        } else {
          // Жесткое квантование (всего 4 оттенка серого)
          val = Math.floor(Math.max(0, Math.min(255, lum)) / 85) * 85;
        }

        data[i] = data[i+1] = data[i+2] = val;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }
  requestAnimationFrame(processFrame);
}

// Сохранение кадра с ужасным JPEG-сжатием
snapBtn.addEventListener('click', () => {
  // Увеличиваем итоговый файл в 2 раза перед сохранением, чтобы JPEG-артефакты легли поверх пикселей
  const saveCanvas = document.createElement('canvas');
  saveCanvas.width = W * 2;
  saveCanvas.height = H * 2;
  const sCtx = saveCanvas.getContext('2d');
  sCtx.imageSmoothingEnabled = false;
  sCtx.drawImage(canvas, 0, 0, saveCanvas.width, saveCanvas.height);

  // Качество 0.15 (15%) дает ту самую грязь и квадраты сжатия
  const dataUrl = saveCanvas.toDataURL('image/jpeg', 0.15);
  const link = document.createElement('a');
  link.download = `03MP_${Date.now()}.jpg`;
  link.href = dataUrl;
  link.click();
});
</script>
</body>
</html>
