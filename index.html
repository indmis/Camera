<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>0.3MP Dither Cam — CRT & Receipt</title>
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d0d;
    color: #fff;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  #viewfinder {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  video {
    position: absolute;
    top: 0;
    left: 0;
    width: 2px;
    height: 2px;
    opacity: 0.01;
    pointer-events: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  #status {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.75);
    color: #0f0;
    font-size: 11px;
    padding: 3px 6px;
    border: 1px solid #222;
    pointer-events: none;
    line-height: 1.4;
    z-index: 10;
  }
  #status .rec { color: #f33; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  
  #flash {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.15s ease-out;
  }
  #flash.active { opacity: 0.6; }

  #controls {
    padding: 10px 12px 16px;
    background: #161616;
    border-top: 2px solid #333;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #aaa;
  }
  .slider-row span:first-child { width: 52px; }
  .slider-row span:last-child { width: 34px; text-align: right; }
  input[type="range"] {
    flex: 1;
    accent-color: #fff;
    height: 6px;
    background: #333;
  }
  .btn-row {
    display: flex;
    gap: 6px;
  }
  button {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 10px 6px;
    font-family: monospace;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
  }
  button:active, button.active {
    background: #fff;
    color: #000;
  }
  #snap {
    background: #fff;
    color: #000;
    font-size: 14px;
    padding: 12px;
    flex: 2;
  }
  #snap:active { background: #888; }
  #gif {
    background: #1a1a1a;
    border-color: #f33;
    color: #f33;
    flex: 1;
  }
  #gif.rec-active {
    background: #f33;
    color: #fff;
    animation: pulse 0.8s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,51,51,0.4); } }
</style>
</head>
<body>

<div id="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">ЗАПУСК...</div>
  <div id="flash"></div>
</div>

<div id="controls">
  <div class="slider-row">
    <span>КОНТР</span>
    <input type="range" id="contrast" min="50" max="250" value="125">
    <span id="contrastVal">1.25</span>
  </div>
  <div class="btn-row">
    <button id="modeBtn">ДИЗЕР 1-BIT</button>
    <button id="resBtn">240x320</button>
    <button id="invBtn">ИНВ</button>
  </div>
  <div class="btn-row">
    <button id="snap">СНЯТЬ КАДР</button>
    <button id="gif">GIF</button>
  </div>
</div>

<!-- ВСТРОЕННАЯ БИБЛИОТЕКА GIF.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const viewfinder = document.getElementById('viewfinder');
const flashEl = document.getElementById('flash');

const modeBtn = document.getElementById('modeBtn');
const resBtn = document.getElementById('resBtn');
const invBtn = document.getElementById('invBtn');
const snapBtn = document.getElementById('snap');
const gifBtn = document.getElementById('gif');
const statusEl = document.getElementById('status');

const contrastSlider = document.getElementById('contrast');
const contrastVal = document.getElementById('contrastVal');

const resolutions = [
  { w: 120, h: 160, label: '120x160' },
  { w: 240, h: 320, label: '240x320' },
  { w: 480, h: 640, label: '480x640' }
];
let resIdx = 1;
let W = resolutions[resIdx].w;
let H = resolutions[resIdx].h;
canvas.width = W;
canvas.height = H;

const modes = [
  'ДИЗЕР 1-BIT',
  'КСЕРОКС 2-BIT',
  'ГРЯЗЬ + ШУМ',
  'БРЕЛОК RGB',
  'ПОРОГ 1-BIT',
  'CRT',
  'RECEIPT'
];
let mode = 0;
let invert = false;
let contrast = 1.25;

// Камера
let facingMode = 'environment';
let currentStream = null;
let frameLoopActive = false;
let isSwitchingCamera = false;

let prevRaw = null;
let fpnMap = null;
let lastSensorHash = 0;
let cachedDynamicNoise = null;

let lastAcc = { x: 0, y: 0, z: 0 };
let motionIntensity = 0;

let starOffsetX = 0;
let starOffsetY = 0;
const STAR_PARALLAX = 6;

const bayer = new Uint8Array(16);
const bayerSrc = "0,128,32,160,192,64,224,96,48,176,16,144,240,112,208,80".split(",");
for (let i = 0; i < 16; i++) bayer[i] = parseInt(bayerSrc[i], 10);

function initSensorBuffers() {
  const size = W * H;
  prevRaw = new Float32Array(size * 3);
  fpnMap = new Float32Array(size);
  cachedDynamicNoise = new Float32Array(size);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const idx = y * W + x;
      let n = (Math.random() - 0.5) * 6;
      const rnd = Math.random();
      if (rnd > 0.9985) n += 110;
      else if (rnd < 0.0015) n -= 110;
      fpnMap[idx] = n;
    }
  }

  starOffsetX = 0;
  starOffsetY = 0;
}

initSensorBuffers();

function handleMotion(e) {
  const acc = e.accelerationIncludingGravity || e.acceleration;
  if (!acc || acc.x === null) return;
  const dx = acc.x - lastAcc.x;
  const dy = acc.y - lastAcc.y;
  const dz = acc.z - lastAcc.z;
  lastAcc = { x: acc.x, y: acc.y, z: acc.z };

  const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);
  const instant = Math.min(1, delta / 4.5);
  motionIntensity = Math.max(instant, motionIntensity * 0.85);

  starOffsetX -= dx * STAR_PARALLAX * 0.1;
  starOffsetY += dy * STAR_PARALLAX * 0.1;

  starOffsetX *= 0.995;
  starOffsetY *= 0.995;
}

if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
  document.body.addEventListener('click', async () => {
    try {
      const state = await DeviceMotionEvent.requestPermission();
      if (state === 'granted') window.addEventListener('devicemotion', handleMotion);
    } catch (err) {}
  }, { once: true });
} else {
  window.addEventListener('devicemotion', handleMotion);
}

// === КАМЕРА ===
async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = currentStream;
    await video.play();
    if (!frameLoopActive) {
      frameLoopActive = true;
      requestAnimationFrame(processFrame);
    }
  } catch (err) {
    statusEl.textContent = 'ОШИБКА: ' + err.message;
  }
}

// === ПЕРЕКЛЮЧЕНИЕ КАМЕРЫ ПО ДВОЙНОМУ ТАПУ ===
function switchCamera() {
  if (isSwitchingCamera) return;
  isSwitchingCamera = true;

  flashEl.classList.add('active');
  setTimeout(() => flashEl.classList.remove('active'), 150);

  if (navigator.vibrate) navigator.vibrate(40);

  facingMode = (facingMode === 'environment') ? 'user' : 'environment';
  statusEl.textContent = facingMode === 'user' ? 'ФРОНТАЛКА' : 'ЗАДНЯЯ';

  startCamera().finally(() => {
    setTimeout(() => { isSwitchingCamera = false; }, 300);
  });
}

viewfinder.addEventListener('dblclick', (e) => {
  e.preventDefault();
  switchCamera();
});

let lastTap = 0;
viewfinder.addEventListener('touchend', (e) => {
  const now = Date.now();
  const DOUBLE_TAP_DELAY = 300;
  if (now - lastTap < DOUBLE_TAP_DELAY) {
    e.preventDefault();
    switchCamera();
    lastTap = 0;
  } else {
    lastTap = now;
  }
}, { passive: false });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (!video.srcObject || video.paused || video.readyState < 2) {
      startCamera();
    } else {
      video.play().catch(() => startCamera());
    }
  }
});

startCamera();

contrastSlider.addEventListener('input', () => {
  contrast = contrastSlider.value / 100;
  contrastVal.textContent = contrast.toFixed(2);
});

modeBtn.addEventListener('click', () => {
  mode = (mode + 1) % modes.length;
  modeBtn.textContent = modes[mode];
});

resBtn.addEventListener('click', () => {
  resIdx = (resIdx + 1) % resolutions.length;
  W = resolutions[resIdx].w;
  H = resolutions[resIdx].h;
  canvas.width = W;
  canvas.height = H;
  initSensorBuffers();
  resBtn.textContent = resolutions[resIdx].label;
});

invBtn.addEventListener('click', () => {
  invert = !invert;
  invBtn.classList.toggle('active', invert);
});

let frameCount = 0;
let isRecordingGif = false;
let crtScanlineOffset = 0;

function processFrame() {
  if (video.readyState >= 2 && video.videoWidth > 0) {
    frameCount++;

    const vRatio = video.videoWidth / video.videoHeight;
    const cRatio = W / H;
    let sx, sy, sw, sh;
    if (vRatio > cRatio) {
      sh = video.videoHeight;
      sw = sh * cRatio;
      sx = (video.videoWidth - sw) / 2;
      sy = 0;
    } else {
      sw = video.videoWidth;
      sh = sw / cRatio;
      sx = 0;
      sy = (video.videoHeight - sh) / 2;
    }

    // === ЗЕРКАЛИРОВАНИЕ ФРОНТАЛКИ ===
    if (facingMode === 'user') {
      ctx.save();
      ctx.translate(W, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
      ctx.restore();
    } else {
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
    }
    // =============================

    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;

    let hash = 0;
    for (let k = 0; k < data.length; k += 64) {
      hash += data[k];
    }
    const sensorUpdated = (hash !== lastSensorHash);
    lastSensorHash = hash;

    motionIntensity *= 0.94;
    const activeMotion = motionIntensity;

    if (sensorUpdated) {
      const noiseAmp = 6 + activeMotion * 50;
      for (let j = 0; j < cachedDynamicNoise.length; j++) {
        cachedDynamicNoise[j] = (Math.random() - 0.5) * noiseAmp;
      }
    }

    if (frameCount % 10 === 0) {
      const motPct = Math.round(activeMotion * 100);
      const freezeTag = sensorUpdated ? '' : ' [FREEZE]';
      const recTag = isRecordingGif ? ' <span class="rec">● GIF</span>' : '';
      const camTag = facingMode === 'user' ? ' [FRONT]' : '';
      statusEl.innerHTML = `${W}x${H}${camTag} | ДВИЖ:${motPct}%${freezeTag}${recTag}`;
    }

    const effectiveTrail = 0.35;
    const keepNew = 1 - effectiveTrail;

    for (let p = 0; p < W * H; p++) {
      const i = p * 4;
      const p3 = p * 3;
      prevRaw[p3] = prevRaw[p3] * effectiveTrail + data[i] * keepNew;
      prevRaw[p3 + 1] = prevRaw[p3 + 1] * effectiveTrail + data[i + 1] * keepNew;
      prevRaw[p3 + 2] = prevRaw[p3 + 2] * effectiveTrail + data[i + 2] * keepNew;
    }

    // Для CRT: смещение скан-линий и бегущая полоса
    crtScanlineOffset = (crtScanlineOffset + 1) % 6;
    const rollingBarY = (frameCount * 2) % H;

    for (let y = 0; y < H; y++) {
      const rowOffset = (y & 3) << 2;
      for (let x = 0; x < W; x++) {
        const p = y * W + x;
        const i = p * 4;
        const p3 = p * 3;

        let sampleX = x + Math.round(starOffsetX);
        let sampleY = y + Math.round(starOffsetY);
        sampleX = ((sampleX % W) + W) % W;
        sampleY = ((sampleY % H) + H) % H;
        const starIdx = sampleY * W + sampleX;

        const totalNoise = fpnMap[starIdx] + cachedDynamicNoise[p];

        let r = prevRaw[p3];
        let g = prevRaw[p3 + 1];
        let b = prevRaw[p3 + 2];

        // === РЕЖИМЫ 0-4 (дизеринг) ===
        if (mode <= 4) {
          if (mode === 3) {
            const shift = 1 + Math.round(activeMotion * 4);
            const rP = (y * W + Math.min(W - 1, x + shift)) * 3;
            const bP = (y * W + Math.max(0, x - shift)) * 3;

            r = ((prevRaw[rP] - 128) * contrast + 128) + totalNoise;
            g = ((g - 128) * contrast + 128) + totalNoise;
            b = ((prevRaw[bP + 2] - 128) * contrast + 128) + totalNoise;

            r = r > 128 ? 255 : (r > 64 ? 128 : 0);
            g = g > 128 ? 255 : (g > 64 ? 128 : 0);
            b = b > 128 ? 255 : (b > 64 ? 128 : 0);
          } else {
            let lum = 0.299 * r + 0.587 * g + 0.114 * b;
            lum = (lum - 128) * contrast + 128 + totalNoise;
            let val = 0;
            if (mode === 0) {
              const threshold = bayer[rowOffset + (x & 3)];
              val = lum > threshold ? 255 : 0;
            } else if (mode === 1) {
              val = Math.floor(Math.max(0, Math.min(255, lum)) / 85) * 85;
            } else if (mode === 2) {
              val = Math.floor(Math.max(0, Math.min(255, lum)) / 36) * 36;
            } else if (mode === 4) {
              val = lum > 128 ? 255 : 0;
            }
            r = g = b = val;
          }
        }

        // === РЕЖИМ 5: CRT (жёсткий) ===
        else if (mode === 5) {
          // Контраст + шум
          r = (r - 128) * contrast + 128 + totalNoise;
          g = (g - 128) * contrast + 128 + totalNoise;
          b = (b - 128) * contrast + 128 + totalNoise;

          // Скан-линии: каждый 2-й ряд темнее (жёстко)
          if ((y + crtScanlineOffset) % 2 === 0) {
            r *= 0.3; g *= 0.3; b *= 0.3;
          }

          // Бегущая полоса (как помеха на старом ТВ)
          if (Math.abs(y - rollingBarY) < 8) {
            r = Math.min(255, r * 1.4);
            g = Math.min(255, g * 1.4);
            b = Math.min(255, b * 1.4);
          }

          // Мерцание всего кадра
          const flicker = 0.85 + Math.random() * 0.25;
          r *= flicker; g *= flicker; b *= flicker;

          // Свечение (bloom) для ярких пикселей
          if (r > 180 && g > 180 && b > 180) {
            r = Math.min(255, r * 1.15);
            g = Math.min(255, g * 1.15);
            b = Math.min(255, b * 1.15);
          }

          // Зелёный люминофор: гасим красный и синий
          r *= 0.7;
          b *= 0.7;

          // Виньетка (по краям темнее)
          const cx = W / 2, cy = H / 2;
          const dx = (x - cx) / cx;
          const dy = (y - cy) / cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const vignette = Math.max(0, 1 - dist * 0.8);
          r *= vignette; g *= vignette; b *= vignette;
        }

        // === РЕЖИМ 6: RECEIPT (чек) ===
        else if (mode === 6) {
          let lum = 0.299 * r + 0.587 * g + 0.114 * b;
          lum = (lum - 128) * contrast + 128;
          const noise = (Math.random() - 0.5) * 80;
          const paperVal = lum + noise > 128 ? 255 : 0;

          if (paperVal > 128) {
            r = 255; g = 250; b = 220;
          } else {
            r = 30; g = 30; b = 30;
          }

          if (Math.random() < 0.01) {
            r = 255; g = 250; b = 220;
          }
          if (Math.random() < 0.002) {
            r *= 0.7; g *= 0.7; b *= 0.7;
          }
        }

        if (invert) {
          r = 255 - r;
          g = 255 - g;
          b = 255 - b;
        }

        r = Math.max(0, Math.min(255, r));
        g = Math.max(0, Math.min(255, g));
        b = Math.max(0, Math.min(255, b));

        data[i] = r;
        data[i + 1] = g;
        data[i + 2] = b;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }
  requestAnimationFrame(processFrame);
}

// === АПСКЕЙЛ БЕЗ СГЛАЖИВАНИЯ ===
function upscaleCanvas(sourceCanvas, scale) {
  const bigCanvas = document.createElement('canvas');
  bigCanvas.width = sourceCanvas.width * scale;
  bigCanvas.height = sourceCanvas.height * scale;
  const bigCtx = bigCanvas.getContext('2d');
  bigCtx.imageSmoothingEnabled = false;
  bigCtx.drawImage(sourceCanvas, 0, 0, bigCanvas.width, bigCanvas.height);
  return bigCanvas;
}

snapBtn.addEventListener('click', () => {
  const UPSCALE = 4;
  const bigCanvas = upscaleCanvas(canvas, UPSCALE);
  const dataUrl = bigCanvas.toDataURL('image/jpeg', 0.85);
  const link = document.createElement('a');
  link.download = `03MP_${modes[mode].replace(/\s+/g, '')}_${Date.now()}.jpg`;
  link.href = dataUrl;
  link.click();
});

// === ЗАПИСЬ GIF ===
let gif = null;
let gifFrames = 0;
const GIF_MAX_FRAMES = 50;
let gifInterval = null;

gifBtn.addEventListener('click', () => {
  if (!isRecordingGif) {
    startGifRecording();
  } else {
    stopGifRecording();
  }
});

function startGifRecording() {
  if (typeof GIF === 'undefined') {
    statusEl.textContent = 'GIF БИБЛИОТЕКА НЕ ЗАГРУЖЕНА';
    return;
  }

  const GIF_UPSCALE = 3;
  const bigW = W * GIF_UPSCALE;
  const bigH = H * GIF_UPSCALE;

  gif = new GIF({
    workers: 2,
    quality: 10,
    width: bigW,
    height: bigH,
    workerScript: './gif.worker.js'
  });

  gifFrames = 0;
  isRecordingGif = true;
  gifBtn.textContent = 'STOP';
  gifBtn.classList.add('rec-active');

  gifInterval = setInterval(() => {
    if (!isRecordingGif) return;
    if (gifFrames >= GIF_MAX_FRAMES) {
      stopGifRecording();
      return;
    }
    try {
      const bigFrame = upscaleCanvas(canvas, GIF_UPSCALE);
      gif.addFrame(bigFrame, { copy: true, delay: 100 });
      gifFrames++;
    } catch (e) {
      console.error('GIF frame error:', e);
    }
  }, 100);

  gif.on('finished', (blob) => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = `0.3MP_GIF_${Date.now()}.gif`;
    link.href = url;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    statusEl.textContent = 'GIF ГОТОВ';
  });
}

function stopGifRecording() {
  isRecordingGif = false;
  if (gifInterval) {
    clearInterval(gifInterval);
    gifInterval = null;
  }
  gifBtn.textContent = 'GIF';
  gifBtn.classList.remove('rec-active');

  if (gif) {
    statusEl.textContent = 'КОДИРУЮ GIF...';
    gif.render();
  }
}

// === САМООБНОВЛЕНИЕ SERVICE WORKER ===
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.update();
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          window.location.reload();
        }
      });
    });
  });
}
</script>

</body>
</html>
