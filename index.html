<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>0.3MP Dither Cam</title>
<link rel="manifest" href="./manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d0d;
    color: #fff;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  #viewfinder {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  video {
    position: absolute;
    top: 0;
    left: 0;
    width: 2px;
    height: 2px;
    opacity: 0.01;
    pointer-events: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  #status {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.75);
    color: #0f0;
    font-size: 11px;
    padding: 3px 6px;
    border: 1px solid #222;
    pointer-events: none;
    line-height: 1.4;
  }
  #status .rec { color: #f33; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  #controls {
    padding: 10px 12px 16px;
    background: #161616;
    border-top: 2px solid #333;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #aaa;
  }
  .slider-row span:first-child { width: 52px; }
  .slider-row span:last-child { width: 34px; text-align: right; }
  input[type="range"] {
    flex: 1;
    accent-color: #fff;
    height: 6px;
    background: #333;
  }
  .btn-row {
    display: flex;
    gap: 6px;
  }
  button {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 10px 6px;
    font-family: monospace;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
  }
  button:active, button.active {
    background: #fff;
    color: #000;
  }
  #snap {
    background: #fff;
    color: #000;
    font-size: 14px;
    padding: 12px;
    flex: 2;
  }
  #snap:active { background: #888; }
  #rec {
    background: #1a1a1a;
    border-color: #f33;
    color: #f33;
    flex: 1;
  }
  #rec.rec-active {
    background: #f33;
    color: #fff;
    animation: pulse 0.8s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,51,51,0.4); } }
</style>
</head>
<body>

<div id="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">ЗАПУСК...</div>
</div>

<div id="controls">
  <div class="slider-row">
    <span>КОНТР</span>
    <input type="range" id="contrast" min="50" max="250" value="125">
    <span id="contrastVal">1.25</span>
  </div>
  <div class="btn-row">
    <button id="modeBtn">ДИЗЕР 1-BIT</button>
    <button id="resBtn">240x320</button>
    <button id="invBtn">ИНВ</button>
  </div>
  <div class="btn-row">
    <button id="snap">СНЯТЬ КАДР</button>
    <button id="rec">REC</button>
  </div>
</div>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const modeBtn = document.getElementById('modeBtn');
const resBtn = document.getElementById('resBtn');
const invBtn = document.getElementById('invBtn');
const snapBtn = document.getElementById('snap');
const recBtn = document.getElementById('rec');
const statusEl = document.getElementById('status');

const contrastSlider = document.getElementById('contrast');
const contrastVal = document.getElementById('contrastVal');

const resolutions = [
  { w: 120, h: 160, label: '120x160' },
  { w: 240, h: 320, label: '240x320' },
  { w: 480, h: 640, label: '480x640' }
];
let resIdx = 1;
let W = resolutions[resIdx].w;
let H = resolutions[resIdx].h;
canvas.width = W;
canvas.height = H;

const modes = [
  'ДИЗЕР 1-BIT',
  'КСЕРОКС 2-BIT',
  'ГРЯЗЬ + ШУМ',
  'БРЕЛОК RGB',
  'ПОРОГ 1-BIT'
];
let mode = 0;
let invert = false;
let contrast = 1.25;

let prevRaw = null;
let fpnMap = null;
let lastSensorHash = 0;
let cachedDynamicNoise = null;

let lastAcc = { x: 0, y: 0, z: 0 };
let motionIntensity = 0;

let starOffsetX = 0;
let starOffsetY = 0;
const STAR_PARALLAX = 6;

const bayer = new Uint8Array(16);
const bayerSrc = "0,128,32,160,192,64,224,96,48,176,16,144,240,112,208,80".split(",");
for (let i = 0; i < 16; i++) bayer[i] = parseInt(bayerSrc[i], 10);

function initSensorBuffers() {
  const size = W * H;
  prevRaw = new Float32Array(size * 3);
  fpnMap = new Float32Array(size);
  cachedDynamicNoise = new Float32Array(size);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const idx = y * W + x;
      let n = (Math.random() - 0.5) * 6;
      const rnd = Math.random();
      if (rnd > 0.9985) n += 110;
      else if (rnd < 0.0015) n -= 110;
      fpnMap[idx] = n;
    }
  }

  starOffsetX = 0;
  starOffsetY = 0;
}

initSensorBuffers();

function handleMotion(e) {
  const acc = e.accelerationIncludingGravity || e.acceleration;
  if (!acc || acc.x === null) return;
  const dx = acc.x - lastAcc.x;
  const dy = acc.y - lastAcc.y;
  const dz = acc.z - lastAcc.z;
  lastAcc = { x: acc.x, y: acc.y, z: acc.z };

  const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);
  const instant = Math.min(1, delta / 4.5);
  motionIntensity = Math.max(instant, motionIntensity * 0.85);

  starOffsetX -= dx * STAR_PARALLAX * 0.1;
  starOffsetY += dy * STAR_PARALLAX * 0.1;

  starOffsetX *= 0.995;
  starOffsetY *= 0.995;
}

if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
  document.body.addEventListener('click', async () => {
    try {
      const state = await DeviceMotionEvent.requestPermission();
      if (state === 'granted') window.addEventListener('devicemotion', handleMotion);
    } catch (err) {}
  }, { once: true });
} else {
  window.addEventListener('devicemotion', handleMotion);
}

let currentStream = null;
let frameLoopActive = false;

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = currentStream;
    await video.play();
    if (!frameLoopActive) {
      frameLoopActive = true;
      requestAnimationFrame(processFrame);
    }
  } catch (err) {
    statusEl.textContent = 'ОШИБКА: ' + err.message;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (!video.srcObject || video.paused || video.readyState < 2) {
      startCamera();
    } else {
      video.play().catch(() => startCamera());
    }
  }
});

startCamera();

contrastSlider.addEventListener('input', () => {
  contrast = contrastSlider.value / 100;
  contrastVal.textContent = contrast.toFixed(2);
});

modeBtn.addEventListener('click', () => {
  mode = (mode + 1) % modes.length;
  modeBtn.textContent = modes[mode];
});

resBtn.addEventListener('click', () => {
  resIdx = (resIdx + 1) % resolutions.length;
  W = resolutions[resIdx].w;
  H = resolutions[resIdx].h;
  canvas.width = W;
  canvas.height = H;
  initSensorBuffers();
  resBtn.textContent = resolutions[resIdx].label;
});

invBtn.addEventListener('click', () => {
  invert = !invert;
  invBtn.classList.toggle('active', invert);
});

let frameCount = 0;

function processFrame() {
  if (video.readyState >= 2 && video.videoWidth > 0) {
    frameCount++;

    const vRatio = video.videoWidth / video.videoHeight;
    const cRatio = W / H;
    let sx, sy, sw, sh;
    if (vRatio > cRatio) {
      sh = video.videoHeight;
      sw = sh * cRatio;
      sx = (video.videoWidth - sw) / 2;
      sy = 0;
    } else {
      sw = video.videoWidth;
      sh = sw / cRatio;
      sx = 0;
      sy = (video.videoHeight - sh) / 2;
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);

    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;

    let hash = 0;
    for (let k = 0; k < data.length; k += 64) {
      hash += data[k];
    }
    const sensorUpdated = (hash !== lastSensorHash);
    lastSensorHash = hash;

    motionIntensity *= 0.94;
    const activeMotion = motionIntensity;

    if (sensorUpdated) {
      const noiseAmp = 6 + activeMotion * 50;
      for (let j = 0; j < cachedDynamicNoise.length; j++) {
        cachedDynamicNoise[j] = (Math.random() - 0.5) * noiseAmp;
      }
    }

    if (frameCount % 10 === 0) {
      const motPct = Math.round(activeMotion * 100);
      const freezeTag = sensorUpdated ? '' : ' [FREEZE]';
      const recTag = recording ? ' <span class="rec">● REC</span>' : '';
      statusEl.innerHTML = `${W}x${H} | ДВИЖ:${motPct}%${freezeTag}${recTag}`;
    }

    const effectiveTrail = 0.35;
    const keepNew = 1 - effectiveTrail;

    for (let p = 0; p < W * H; p++) {
      const i = p * 4;
      const p3 = p * 3;
      prevRaw[p3] = prevRaw[p3] * effectiveTrail + data[i] * keepNew;
      prevRaw[p3 + 1] = prevRaw[p3 + 1] * effectiveTrail + data[i + 1] * keepNew;
      prevRaw[p3 + 2] = prevRaw[p3 + 2] * effectiveTrail + data[i + 2] * keepNew;
    }

    for (let y = 0; y < H; y++) {
      const rowOffset = (y & 3) << 2;
      for (let x = 0; x < W; x++) {
        const p = y * W + x;
        const i = p * 4;
        const p3 = p * 3;

        let sampleX = x + Math.round(starOffsetX);
        let sampleY = y + Math.round(starOffsetY);
        sampleX = ((sampleX % W) + W) % W;
        sampleY = ((sampleY % H) + H) % H;
        const starIdx = sampleY * W + sampleX;

        const totalNoise = fpnMap[starIdx] + cachedDynamicNoise[p];

        let r = prevRaw[p3];
        let g = prevRaw[p3 + 1];
        let b = prevRaw[p3 + 2];

        if (mode === 3) {
          const shift = 1 + Math.round(activeMotion * 4);
          const rP = (y * W + Math.min(W - 1, x + shift)) * 3;
          const bP = (y * W + Math.max(0, x - shift)) * 3;

          r = ((prevRaw[rP] - 128) * contrast + 128) + totalNoise;
          g = ((g - 128) * contrast + 128) + totalNoise;
          b = ((prevRaw[bP + 2] - 128) * contrast + 128) + totalNoise;

          r = r > 128 ? 255 : (r > 64 ? 128 : 0);
          g = g > 128 ? 255 : (g > 64 ? 128 : 0);
          b = b > 128 ? 255 : (b > 64 ? 128 : 0);
        } else {
          let lum = 0.299 * r + 0.587 * g + 0.114 * b;
          lum = (lum - 128) * contrast + 128 + totalNoise;
          let val = 0;
          if (mode === 0) {
            const threshold = bayer[rowOffset + (x & 3)];
            val = lum > threshold ? 255 : 0;
          } else if (mode === 1) {
            val = Math.floor(Math.max(0, Math.min(255, lum)) / 85) * 85;
          } else if (mode === 2) {
            val = Math.floor(Math.max(0, Math.min(255, lum)) / 36) * 36;
          } else if (mode === 4) {
            val = lum > 128 ? 255 : 0;
          }
          r = g = b = val;
        }
        if (invert) {
          r = 255 - r;
          g = 255 - g;
          b = 255 - b;
        }
        data[i] = r;
        data[i + 1] = g;
        data[i + 2] = b;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }
  requestAnimationFrame(processFrame);
}

snapBtn.addEventListener('click', () => {
  const saveCanvas = document.createElement('canvas');
  const scale = Math.max(1, Math.floor(480 / W));
  saveCanvas.width = W * scale;
  saveCanvas.height = H * scale;
  const sCtx = saveCanvas.getContext('2d');
  sCtx.imageSmoothingEnabled = false;
  sCtx.drawImage(canvas, 0, 0, saveCanvas.width, saveCanvas.height);
  const dataUrl = saveCanvas.toDataURL('image/jpeg', 0.12);
  const link = document.createElement('a');
  link.download = `03MP_${modes[mode].replace(/\s+/g, '')}_${Date.now()}.jpg`;
  link.href = dataUrl;
  link.click();
});

let recorder = null;
let recording = false;
let recChunks = [];
let recStartTime = 0;

recBtn.addEventListener('click', () => {
  if (!recording) {
    startRecording();
  } else {
    stopRecording();
  }
});

function startRecording() {
  try {
    const stream = canvas.captureStream(30);
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9'
      : MediaRecorder.isTypeSupported('video/webm')
        ? 'video/webm'
        : 'video/mp4';

    recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 2000000 });
    recChunks = [];
    recStartTime = performance.now();
    recorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(recChunks, { type: mimeType });
      const durationMs = performance.now() - recStartTime;

      fixWebmDuration(blob, durationMs).then(fixedBlob => {
        const url = URL.createObjectURL(fixedBlob);
        const link = document.createElement('a');
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        link.download = `0.3MP_REC_${Date.now()}.${ext}`;
        link.href = url;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      }).catch(err => {
        statusEl.textContent = 'FIX FAIL, SAVING RAW';
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        link.download = `0.3MP_REC_RAW_${Date.now()}.${ext}`;
        link.href = url;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      });
    };
    recorder.start(200);
    recording = true;
    recBtn.textContent = 'STOP';
    recBtn.classList.add('rec-active');
  } catch (err) {
    statusEl.textContent = 'REC: ' + err.message;
  }
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
  }
  recording = false;
  recBtn.textContent = 'REC';
  recBtn.classList.remove('rec-active');
}

// === УНИВЕРСАЛЬНЫЙ ПАТЧ ДЛИТЕЛЬНОСТИ WEBM ===
async function fixWebmDuration(blob, durationMs) {
  if (blob.type.includes('mp4')) return blob;

  try {
    const buffer = await blob.arrayBuffer();
    const data = new Uint8Array(buffer);

    function readVint(pos) {
      const first = data[pos];
      let length = 1;
      let mask = 0x80;
      while (length <= 8 && !(first & mask)) {
        length++;
        mask >>= 1;
      }
      if (length > 8) return null;
      let value = first & (mask - 1);
      for (let i = 1; i < length; i++) {
        value = (value << 8) | data[pos + i];
      }
      return { length, value };
    }

    let pos = 0;
    let segmentPos = -1;
    let segmentSizePos = -1;
    let segmentDataStart = -1;
    let segmentSize = 0;

    while (pos < data.length) {
      const id = readVint(pos);
      if (!id) break;
      let idVal = 0;
      for (let i = 0; i < id.length; i++) idVal = (idVal << 8) | data[pos + i];
      const size = readVint(pos + id.length);
      if (!size) break;
      const dataStart = pos + id.length + size.length;
      if (idVal === 0x18538067) {
        segmentPos = pos;
        segmentSizePos = pos + id.length;
        segmentDataStart = dataStart;
        segmentSize = size.value;
        break;
      }
      if (size.value === -1) break;
      pos = dataStart + size.value;
    }

    if (segmentPos === -1) return blob;

    pos = segmentDataStart;
    let infoPos = -1;
    let infoSizePos = -1;
    let infoDataStart = -1;
    let infoSize = 0;

    while (pos < data.length) {
      const id = readVint(pos);
      if (!id) break;
      let idVal = 0;
      for (let i = 0; i < id.length; i++) idVal = (idVal << 8) | data[pos + i];
      const size = readVint(pos + id.length);
      if (!size) break;
      const dataStart = pos + id.length + size.length;
      if (idVal === 0x1549A966) {
        infoPos = pos;
        infoSizePos = pos + id.length;
        infoDataStart = dataStart;
        infoSize = size.value;
        break;
      }
      if (size.value === -1) break;
      pos = dataStart + size.value;
    }

    if (infoPos === -1) return blob;

    const float64 = new Float64Array(1);
    float64[0] = durationMs;
    const view = new DataView(float64.buffer);
    const durBytes = new Uint8Array(8);
    for (let i = 0; i < 8; i++) durBytes[i] = view.getUint8(7 - i);
    const durBlock = new Uint8Array([0x44, 0x89, 0x88, ...durBytes]);

    // Ищем существующий Duration
    pos = infoDataStart;
    const infoEnd = infoSize === -1 ? data.length : infoDataStart + infoSize;
    let durationDataPos = -1;

    while (pos < infoEnd) {
      const id = readVint(pos);
      if (!id) break;
      let idVal = 0;
      for (let i = 0; i < id.length; i++) idVal = (idVal << 8) | data[pos + i];
      const size = readVint(pos + id.length);
      if (!size) break;
      const dataStart = pos + id.length + size.length;
      if (idVal === 0x4489) {
        durationDataPos = dataStart;
        break;
      }
      if (size.value === -1) break;
      pos = dataStart + size.value;
    }

    if (durationDataPos !== -1) {
      if (data[durationDataPos - 1] === 0x88) {
        const out = new Uint8Array(data);
        for (let i = 0; i < 8; i++) out[durationDataPos + i] = durBytes[i];
        return new Blob([out], { type: 'video/webm' });
      }
    }

    // Вставляем Duration в конец Info
    const insertPos = infoDataStart + (infoSize === -1 ? 0 : infoSize);
    const result = new Uint8Array(data.length + durBlock.length);
    result.set(data.slice(0, insertPos), 0);
    result.set(durBlock, insertPos);
    result.set(data.slice(insertPos), insertPos + durBlock.length);

    return new Blob([result], { type: 'video/webm' });
  } catch (err) {
    console.error('fixWebmDuration error:', err);
    return blob;
  }
}

// === САМООБНОВЛЕНИЕ SERVICE WORKER ===
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.update();
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          window.location.reload();
        }
      });
    });
  });
}
</script>

</body>
</html>
