<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>0.3MP Dither Cam v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d0d;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #viewfinder {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  video {
    position: absolute;
    width: 2px; height: 2px;
    opacity: 0.01;
    pointer-events: none;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #status {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.8);
    color: #0f0;
    font-size: 10px;
    padding: 4px 8px;
    border: 1px solid #1a1a1a;
    border-radius: 3px;
    pointer-events: none;
    line-height: 1.5;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
  #status .rec { color: #f33; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  #controls {
    padding: 10px 12px 14px;
    background: #161616;
    border-top: 2px solid #333;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #aaa;
    font-weight: bold;
  }
  .slider-row span:first-child { width: 56px; }
  .slider-row span:last-child { width: 38px; text-align: right; color: #fff; }
  input[type="range"] {
    flex: 1;
    accent-color: #0f0;
    height: 6px;
    background: #333;
    border-radius: 3px;
  }
  .btn-row {
    display: flex;
    gap: 5px;
  }
  button {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 9px 4px;
    font-family: inherit;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
    border-radius: 3px;
    transition: all 0.1s;
    letter-spacing: 0.3px;
  }
  button:active { transform: scale(0.96); }
  button.active {
    background: #0f0;
    color: #000;
    border-color: #0f0;
  }
  button.rec-active {
    background: #f33;
    color: #fff;
    border-color: #f33;
    animation: pulse 0.8s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(255,51,51,0.4); } }
  #snap {
    background: #fff;
    color: #000;
    font-size: 13px;
    padding: 11px;
    flex: 2;
  }
  #rec {
    background: #1a1a1a;
    border-color: #f33;
    color: #f33;
  }
  #rec.rec-active { background: #f33; color: #fff; }
</style>
</head>
<body>

<div id="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">ИНИЦИАЛИЗАЦИЯ...</div>
</div>

<div id="controls">
  <div class="slider-row">
    <span>КОНТР</span>
    <input type="range" id="contrast" min="50" max="250" value="125">
    <span id="contrastVal">1.25</span>
  </div>
  <div class="slider-row">
    <span>ШЛЕЙФ</span>
    <input type="range" id="blur" min="0" max="90" value="35">
    <span id="blurVal">35%</span>
  </div>
  <div class="btn-row">
    <button id="modeBtn">ДИЗЕР 1-BIT</button>
    <button id="resBtn">320x240</button>
    <button id="gyroBtn">ГИРО: АВТО</button>
  </div>
  <div class="btn-row">
    <button id="invBtn">ИНВ</button>
    <button id="camBtn">ЗАДНЯЯ</button>
    <button id="rotBtn">ПОВОРОТ</button>
  </div>
  <div class="btn-row">
    <button id="snap">СНЯТЬ КАДР</button>
    <button id="rec">REC</button>
  </div>
</div>

<script>
'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false });

const modeBtn = document.getElementById('modeBtn');
const resBtn = document.getElementById('resBtn');
const gyroBtn = document.getElementById('gyroBtn');
const invBtn = document.getElementById('invBtn');
const camBtn = document.getElementById('camBtn');
const rotBtn = document.getElementById('rotBtn');
const snapBtn = document.getElementById('snap');
const recBtn = document.getElementById('rec');
const statusEl = document.getElementById('status');

const contrastSlider = document.getElementById('contrast');
const contrastVal = document.getElementById('contrastVal');
const blurSlider = document.getElementById('blur');
const blurVal = document.getElementById('blurVal');

const RESOLUTIONS = [
  { w: 160, h: 120, label: '160x120' },
  { w: 320, h: 240, label: '320x240' },
  { w: 480, h: 360, label: '480x360' }
];
const MODES = [
  'ДИЗЕР 1-BIT',
  'КСЕРОКС 2-BIT',
  'ГРЯЗЬ + ШУМ',
  'БРЕЛОК RGB',
  'ПОРОГ 1-BIT'
];
const MODES_COUNT = MODES.length;

let resIdx = 1;
let W = RESOLUTIONS[resIdx].w;
let H = RESOLUTIONS[resIdx].h;
let mode = 0;
let invert = false;
let contrast = 1.25;
let blurTrail = 0.35;
let gyroActive = true;
let facingMode = 'environment';
let rotation = 0;

const BAYER8 = new Uint8Array(64);
(function buildBayer() {
  const m4 = [
    0, 8, 2, 10,
    12, 4, 14, 6,
    3, 11, 1, 9,
    15, 7, 13, 5
  ];
  for (let y = 0; y < 8; y++) {
    for (let x = 0; x < 8; x++) {
      const base = m4[(y % 4) * 4 + (x % 4)];
      const add = ((y >> 2) * 2 + (x >> 2)) * 16;
      BAYER8[y * 8 + x] = Math.floor((base + add) * 255 / 64);
    }
  }
})();

let prevRaw = new Float32Array(W * H * 3);
let fpnMap = new Float32Array(W * H);
let hotPixels = new Uint8Array(W * H);
let cachedDynamicNoise = new Float32Array(W * H * 3);
let motionIntensity = 0;
let lastAcc = { x: 0, y: 0, z: 0 };
let lastSensorHash = 0;
let frameCount = 0;
let fps = 0;
let fpsFrames = 0;
let fpsLastTime = performance.now();

let vignetteMask = null;

function rebuildBuffers() {
  const size = W * H;
  prevRaw = new Float32Array(size * 3);
  fpnMap = new Float32Array(size);
  hotPixels = new Uint8Array(size);
  cachedDynamicNoise = new Float32Array(size * 3);
  vignetteMask = new Float32Array(size);

  const colNoise = new Float32Array(W);
  for (let x = 0; x < W; x++) colNoise[x] = (Math.random() - 0.5) * 10;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const idx = y * W + x;
      fpnMap[idx] = colNoise[x] + (Math.random() - 0.5) * 6;
      if (Math.random() < 0.0015) hotPixels[idx] = 1;
    }
  }

  const cx = W / 2, cy = H / 2;
  const maxR = Math.sqrt(cx * cx + cy * cy);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - cx, dy = y - cy;
      const r = Math.sqrt(dx * dx + dy * dy) / maxR;
      vignetteMask[y * W + x] = 1 - Math.pow(r, 2.2) * 0.55;
    }
  }

  canvas.width = W;
  canvas.height = H;
}

rebuildBuffers();

function handleMotion(e) {
  const acc = e.accelerationIncludingGravity || e.acceleration;
  if (!acc || acc.x === null) return;
  const dx = acc.x - lastAcc.x;
  const dy = acc.y - lastAcc.y;
  const dz = acc.z - lastAcc.z;
  lastAcc = { x: acc.x, y: acc.y, z: acc.z };
  const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);
  const instant = Math.min(1, delta / 4.0);
  motionIntensity = Math.max(instant, motionIntensity * 0.88);
}

window.addEventListener('devicemotion', handleMotion);

let currentStream = null;

async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  try {
    const constraints = {
      video: {
        facingMode: facingMode,
        width: { ideal: 1280 },
        height: { ideal: 720 },
        frameRate: { ideal: 30 }
      },
      audio: false
    };
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    await video.play();
    startFrameLoop();
  } catch (err) {
    statusEl.textContent = 'КАМЕРА: ' + err.message;
  }
}

let frameLoopActive = false;

function startFrameLoop() {
  if (frameLoopActive) return;
  frameLoopActive = true;
  if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
    const cb = () => {
      processFrame();
      video.requestVideoFrameCallback(cb);
    };
    video.requestVideoFrameCallback(cb);
  } else {
    const loop = () => {
      processFrame();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
}

function processFrame() {
  if (video.readyState < 2 || video.videoWidth === 0) return;

  frameCount++;
  fpsFrames++;
  const now = performance.now();
  if (now - fpsLastTime >= 1000) {
    fps = fpsFrames;
    fpsFrames = 0;
    fpsLastTime = now;
  }

  const vw = video.videoWidth, vh = video.videoHeight;
  const vRatio = vw / vh;
  const cRatio = W / H;
  let sx, sy, sw, sh;
  if (vRatio > cRatio) {
    sh = vh;
    sw = sh * cRatio;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    sw = vw;
    sh = sw / cRatio;
    sx = 0;
    sy = (vh - sh) / 2;
  }

  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const imgData = ctx.getImageData(0, 0, W, H);
  const data = imgData.data;

  let hash = 0;
  for (let k = 0; k < data.length; k += 128) hash = (hash + data[k]) | 0;
  const sensorUpdated = (hash !== lastSensorHash);
  lastSensorHash = hash;

  motionIntensity *= 0.94;
  const activeMotion = gyroActive ? motionIntensity : 0.4;

  if (sensorUpdated) {
    const amp = 4 + activeMotion * 55;
    for (let j = 0; j < cachedDynamicNoise.length; j++) {
      cachedDynamicNoise[j] = (Math.random() - 0.5) * amp;
    }
  }

  const effectiveTrail = Math.min(0.92, blurTrail * (1 - activeMotion * 0.35));
  const keepNew = 1 - effectiveTrail;

  for (let p = 0; p < W * H; p++) {
    const i = p * 4;
    const p3 = p * 3;
    prevRaw[p3]     = prevRaw[p3]     * effectiveTrail + data[i]     * keepNew;
    prevRaw[p3 + 1] = prevRaw[p3 + 1] * effectiveTrail + data[i + 1] * keepNew;
    prevRaw[p3 + 2] = prevRaw[p3 + 2] * effectiveTrail + data[i + 2] * keepNew;
  }

  const shift = mode === 3 ? 1 + Math.round(activeMotion * 4) : 0;
  const inv = invert;

  for (let y = 0; y < H; y++) {
    const bayerRow = (y & 7) * 8;
    for (let x = 0; x < W; x++) {
      const p = y * W + x;
      const i = p * 4;
      const p3 = p * 3;

      const vig = vignetteMask[p];

      const nR = fpnMap[p] + cachedDynamicNoise[p3];
      const nG = fpnMap[p] + cachedDynamicNoise[p3 + 1];
      const nB = fpnMap[p] + cachedDynamicNoise[p3 + 2];

      let r, g, b;

      if (mode === 3) {
        const rX = Math.min(W - 1, x + shift);
        const bX = Math.max(0, x - shift);
        const rP = (y * W + rX) * 3;
        const bP = (y * W + bX) * 3;

        r = ((prevRaw[rP]     - 128) * contrast + 128) * vig + nR;
        g = ((prevRaw[p3 + 1] - 128) * contrast + 128) * vig + nG;
        b = ((prevRaw[bP + 2] - 128) * contrast + 128) * vig + nB;

        r = r > 160 ? 255 : (r > 96 ? 160 : (r > 32 ? 64 : 0));
        g = g > 160 ? 255 : (g > 96 ? 160 : (g > 32 ? 64 : 0));
        b = b > 160 ? 255 : (b > 96 ? 160 : (b > 32 ? 64 : 0));
      } else {
        const r0 = prevRaw[p3]     * vig + nR;
        const g0 = prevRaw[p3 + 1] * vig + nG;
        const b0 = prevRaw[p3 + 2] * vig + nB;
        let lum = 0.299 * r0 + 0.587 * g0 + 0.114 * b0;
        lum = (lum - 128) * contrast + 128;

        let val = 0;
        if (mode === 0) {
          const thr = BAYER8[bayerRow + (x & 7)];
          val = lum > thr ? 255 : 0;
        } else if (mode === 1) {
          val = lum < 64 ? 0 : lum < 128 ? 64 : lum < 192 ? 128 : 255;
        } else if (mode === 2) {
          val = Math.floor(Math.max(0, Math.min(255, lum)) / 32) * 32;
        } else {
          val = lum > 128 ? 255 : 0;
        }
        r = g = b = val;
      }

      if (hotPixels[p]) {
        const flick = Math.random();
        if (flick > 0.7) { r = 255; g = 255; b = 255; }
        else if (flick < 0.1) { r = 0; g = 0; b = 0; }
      }

      if (inv) {
        r = 255 - r;
        g = 255 - g;
        b = 255 - b;
      }

      data[i]     = r;
      data[i + 1] = g;
      data[i + 2] = b;
    }
  }

  ctx.putImageData(imgData, 0, 0);

  if (frameCount % 8 === 0) {
    const motPct = Math.round(activeMotion * 100);
    const freezeTag = sensorUpdated ? '' : ' [FREEZE]';
    const recTag = recording ? ' <span class="rec">● REC</span>' : '';
    statusEl.innerHTML = W + 'x' + H + ' | ' + fps + ' FPS | ДВ:' + motPct + '%' + freezeTag + recTag;
  }
}

contrastSlider.addEventListener('input', () => {
  contrast = contrastSlider.value / 100;
  contrastVal.textContent = contrast.toFixed(2);
});

blurSlider.addEventListener('input', () => {
  blurTrail = blurSlider.value / 100;
  blurVal.textContent = blurSlider.value + '%';
});

modeBtn.addEventListener('click', () => {
  mode = (mode + 1) % MODES_COUNT;
  modeBtn.textContent = MODES[mode];
  if (navigator.vibrate) navigator.vibrate(20);
});

resBtn.addEventListener('click', () => {
  resIdx = (resIdx + 1) % RESOLUTIONS.length;
  W = RESOLUTIONS[resIdx].w;
  H = RESOLUTIONS[resIdx].h;
  rebuildBuffers();
  resBtn.textContent = RESOLUTIONS[resIdx].label;
  if (navigator.vibrate) navigator.vibrate(20);
});

gyroBtn.addEventListener('click', async () => {
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const state = await DeviceMotionEvent.requestPermission();
      if (state === 'granted') window.addEventListener('devicemotion', handleMotion);
    } catch (err) {}
  }
  gyroActive = !gyroActive;
  gyroBtn.textContent = gyroActive ? 'ГИРО: АВТО' : 'ГИРО: ВЫКЛ';
  gyroBtn.classList.toggle('active', gyroActive);
  if (navigator.vibrate) navigator.vibrate(20);
});

invBtn.addEventListener('click', () => {
  invert = !invert;
  invBtn.classList.toggle('active', invert);
  if (navigator.vibrate) navigator.vibrate(20);
});

camBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  camBtn.textContent = facingMode === 'environment' ? 'ЗАДНЯЯ' : 'ПЕРЕДНЯЯ';
  startCamera();
  if (navigator.vibrate) navigator.vibrate(20);
});

rotBtn.addEventListener('click', () => {
  rotation = (rotation + 90) % 360;
  canvas.style.transform = 'rotate(' + rotation + 'deg)';
  if (rotation === 90 || rotation === 270) {
    canvas.style.maxWidth = '100vh';
    canvas.style.maxHeight = '100vw';
  } else {
    canvas.style.maxWidth = '100%';
    canvas.style.maxHeight = '100%';
  }
  if (navigator.vibrate) navigator.vibrate(20);
});

snapBtn.addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(30);
  const saveCanvas = document.createElement('canvas');
  const scale = Math.max(1, Math.floor(720 / Math.max(W, H)));
  saveCanvas.width = W * scale;
  saveCanvas.height = H * scale;
  const sCtx = saveCanvas.getContext('2d');
  sCtx.imageSmoothingEnabled = false;
  sCtx.drawImage(canvas, 0, 0, saveCanvas.width, saveCanvas.height);
  const dataUrl = saveCanvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.download = '0.3MP_' + MODES[mode].replace(/\s+/g, '_') + '_' + Date.now() + '.png';
  link.href = dataUrl;
  link.click();
});

let recorder = null;
let recording = false;
let recChunks = [];
let recStartTime = 0;

recBtn.addEventListener('click', () => {
  if (navigator.vibrate) navigator.vibrate(30);
  if (!recording) {
    startRecording();
  } else {
    stopRecording();
  }
});

function startRecording() {
  try {
    const stream = canvas.captureStream(30);
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9'
      : MediaRecorder.isTypeSupported('video/webm')
        ? 'video/webm'
        : 'video/mp4';

    recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 2000000 });
    recChunks = [];
    recorder.ondataavailable = function(e) { if (e.data.size > 0) recChunks.push(e.data); };
    recorder.onstop = function() {
      const blob = new Blob(recChunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
      link.download = '0.3MP_REC_' + Date.now() + '.' + ext;
      link.href = url;
      link.click();
      setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
    };
    recorder.start(200);
    recording = true;
    recStartTime = performance.now();
    recBtn.textContent = 'STOP';
    recBtn.classList.add('rec-active');
  } catch (err) {
    statusEl.textContent = 'REC: ' + err.message;
  }
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
  }
  recording = false;
  recBtn.textContent = 'REC';
  recBtn.classList.remove('rec-active');
}

startCamera();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function() {});
}
</script>

</body>
</html>
