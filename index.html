<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>0.3MP Dither Cam</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #fff;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  #viewfinder {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }
  video {
    position: absolute;
    top: 0;
    left: 0;
    width: 2px;
    height: 2px;
    opacity: 0.01;
    pointer-events: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  #status {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    color: #0f0;
    font-size: 11px;
    padding: 3px 6px;
    pointer-events: none;
  }
  #controls {
    padding: 15px;
    background: #1a1a1a;
    border-top: 2px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  button {
    background: #000;
    color: #fff;
    border: 2px solid #fff;
    padding: 14px 16px;
    font-family: monospace;
    font-size: 14px;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
  }
  button:active { background: #fff; color: #000; }
  #snap { background: #fff; color: #000; }
  #snap:active { background: #888; }
</style>
</head>
<body>

<div id="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="status">ЗАПУСК КАМЕРЫ...</div>
</div>

<div id="controls">
  <button id="modeBtn">ДИЗЕР 1-BIT</button>
  <button id="snap">СНЯТЬ</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const modeBtn = document.getElementById('modeBtn');
const snapBtn = document.getElementById('snap');
const statusEl = document.getElementById('status');

const W = 240;
const H = 320;
canvas.width = W;
canvas.height = H;

let mode = 0;
const modes = ['ДИЗЕР 1-BIT', 'КСЕРОКС 2-BIT', 'ГРЯЗНОЕ Ч/Б'];

// Одномерный массив матрицы Байера 4x4 (одинарные скобки не съедаются при копировании)
const bayer = new Uint8Array([
   15, 135,  45, 165,
  195,  75, 225, 105,
   60, 180,  30, 150,
  240, 120, 210,  90
]);

let frameCount = 0;

navigator.mediaDevices.getUserMedia({
  video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
  audio: false
}).then(stream => {
  video.srcObject = stream;
  video.play();
  requestAnimationFrame(processFrame);
}).catch(err => {
  statusEl.textContent = 'ОШИБКА: ' + err.message;
});

modeBtn.addEventListener('click', () => {
  mode = (mode + 1) % modes.length;
  modeBtn.textContent = modes[mode];
});

function processFrame() {
  if (video.readyState >= 2 && video.videoWidth > 0) {
    frameCount++;
    if (frameCount % 15 === 0) {
      statusEl.textContent = `LIVE | ${W}x${H} | КАДР #${frameCount}`;
    }

    const vRatio = video.videoWidth / video.videoHeight;
    const cRatio = W / H;
    let sx, sy, sw, sh;
    if (vRatio > cRatio) {
      sh = video.videoHeight;
      sw = sh * cRatio;
      sx = (video.videoWidth - sw) / 2;
      sy = 0;
    } else {
      sw = video.videoWidth;
      sh = sw / cRatio;
      sx = 0;
      sy = (video.videoHeight - sh) / 2;
    }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);

    const imgData = ctx.getImageData(0, 0, W, H);
    const data = imgData.data;

    for (let y = 0; y < H; y++) {
      const rowOffset = (y & 3) << 2;
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        let lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        lum = (lum - 128) * 1.25 + 128;

        let val = 0;
        if (mode === 0) {
          const threshold = bayer[rowOffset + (x & 3)];
          val = lum > threshold ? 255 : 0;
        } else if (mode === 1) {
          val = Math.floor(Math.max(0, Math.min(255, lum)) / 85) * 85;
        } else {
          // 8 уровней серого + легкий цифровой шум
          const noise = (Math.random() - 0.5) * 35;
          val = Math.floor(Math.max(0, Math.min(255, lum + noise)) / 36) * 36;
        }

        data[i] = data[i+1] = data[i+2] = val;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }
  requestAnimationFrame(processFrame);
}

snapBtn.addEventListener('click', () => {
  const saveCanvas = document.createElement('canvas');
  saveCanvas.width = W * 2;
  saveCanvas.height = H * 2;
  const sCtx = saveCanvas.getContext('2d');
  sCtx.imageSmoothingEnabled = false;
  sCtx.drawImage(canvas, 0, 0, saveCanvas.width, saveCanvas.height);

  const dataUrl = saveCanvas.toDataURL('image/jpeg', 0.15);
  const link = document.createElement('a');
  link.download = `03MP_${Date.now()}.jpg`;
  link.href = dataUrl;
  link.click();
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
       }
</script>
</body>
</html>
